<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1810">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Vinn Caffe — pesan kopi dan makanan, bayar, dan cetak struk dari HP.">
  <meta name="application-name" content="Vinn Caffe">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vinn Caffe">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Vinn Caffe</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"><div id="device">
  <i class="btn-a"></i><i class="btn-v1"></i><i class="btn-v2"></i><i class="btn-p"></i>
  <div id="screen">
    <div class="fsb" aria-hidden="true"><span class="fsbL"><span id="sbTime">9:41</span><span class="stNet"></span></span><span class="fsbR"><span class="stBat"></span></span></div>
    <div class="island" aria-hidden="true"></div>
    <div id="scroll">
      <section id="lock" class="lock">
        <div class="status"><span class="stNet"></span><span class="stBat"></span></div>
        <div class="lk-brand"><img src="assets/logo.svg" width="64" height="64" alt="Logo Vinn Caffe"><h1 id="lkName">Vinn Caffe</h1></div>
        <div class="clock"><div id="lkDate"></div><div id="lkTime">00:00</div></div>
        <p class="lk-msg" id="lkMsg" role="status">Masukkan PIN</p>
        <div class="dots" id="dots" aria-hidden="true"></div>
        <div class="pad" id="pad"></div>
        <button class="install" id="install" hidden>Pasang aplikasi di layar utama</button>
        <p class="ioshint" id="ioshint" hidden>Untuk memasang di iPhone: ketuk Bagikan, lalu “Tambah ke Layar Utama”.</p>
      </section>
      <div id="app" hidden>
        <main>
          <section class="view" id="v-menu" hidden></section>
          <section class="view" id="v-cart" hidden></section>
          <section class="view" id="v-hist" hidden></section>
          <section class="view" id="v-admin" hidden></section>
          <section class="view" id="v-checkout" hidden></section>
          <section class="view" id="v-receipt" hidden></section>
        </main>
      </div>
    </div>
    <nav id="nav" hidden></nav>
    <div class="overlay" id="modal" hidden></div>
    <div class="toast" id="toast" role="status"></div>
    <i class="homebar" aria-hidden="true"></i>
  </div>
</div></div>
<script src="config.js"></script>
<script src="menu.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
