<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1810">
  <meta name="description" content="Vinn Caffe — pesan kopi dan makanan, bayar, dan cetak struk dari HP.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vinn Caffe">
  <title>Vinn Caffe</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="device-frame" id="deviceFrame">
<section id="lock" class="lock">
  <div class="status"><span id="stNet"></span><span id="stBat"></span></div>
  <div class="lk-brand"><img src="assets/logo.svg" width="72" height="72" alt="Logo Vinn Caffe"><h1 id="lkName">Vinn Caffe</h1></div>
  <div class="clock"><div id="lkTime" aria-live="off">00:00:00</div><div id="lkDate"></div></div>
  <p class="lk-msg" id="lkMsg" role="status">Masukkan PIN</p>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="pad" id="pad"></div>
</section>

<div id="app" hidden>
  <main>
    <section class="view" id="v-menu" hidden></section>
    <section class="view" id="v-cart" hidden></section>
    <section class="view" id="v-hist" hidden></section>
    <section class="view" id="v-admin" hidden></section>
    <section class="view" id="v-checkout" hidden></section>
    <section class="view" id="v-receipt" hidden></section>
  </main>
  <nav id="nav" hidden></nav>
</div>
<i class="phone-button phone-button-left" aria-hidden="true"></i>
<i class="phone-button phone-button-right" aria-hidden="true"></i>
</div>

<div class="overlay" id="modal" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="menu.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
